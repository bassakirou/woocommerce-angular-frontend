<div class="max-w-md mx-auto mt-10 p-6 bg-white rounded-lg shadow-md">
  <h1 class="text-2xl font-bold mb-6 text-center">Test Login</h1>

  <div *ngIf="errorMessage" class="mb-4 p-3 bg-red-100 text-red-700 rounded">
    {{ errorMessage }}
  </div>

  <div
    *ngIf="successMessage"
    class="mb-4 p-3 bg-green-100 text-green-700 rounded"
  >
    {{ successMessage }}
  </div>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div class="mb-4">
      <label for="username" class="block text-sm font-medium text-gray-700 mb-1"
        >Username or Email</label
      >
      <input
        type="text"
        id="username"
        formControlName="username"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary"
        [ngClass]="{
          'border-red-500':
            loginForm.get('username')?.invalid &&
            loginForm.get('username')?.touched
        }"
      />
      <div
        *ngIf="
          loginForm.get('username')?.invalid &&
          loginForm.get('username')?.touched
        "
        class="text-red-500 text-sm mt-1"
      >
        Username or email is required
      </div>
    </div>

    <div class="mb-6">
      <label for="password" class="block text-sm font-medium text-gray-700 mb-1"
        >Password</label
      >
      <input
        type="password"
        id="password"
        formControlName="password"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary"
        [ngClass]="{
          'border-red-500':
            loginForm.get('password')?.invalid &&
            loginForm.get('password')?.touched
        }"
      />
      <div
        *ngIf="
          loginForm.get('password')?.invalid &&
          loginForm.get('password')?.touched
        "
        class="text-red-500 text-sm mt-1"
      >
        Password is required
      </div>
    </div>

    <button
      type="submit"
      [disabled]="loginForm.invalid || isLoading"
      class="w-full bg-primary text-white py-2 px-4 rounded-md hover:bg-primary-dark transition-colors disabled:bg-gray-400"
    >
      <span *ngIf="isLoading" class="inline-block mr-2">
        <svg
          class="animate-spin h-5 w-5 text-white"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
        >
          <circle
            class="opacity-25"
            cx="12"
            cy="12"
            r="10"
            stroke="currentColor"
            stroke-width="4"
          ></circle>
          <path
            class="opacity-75"
            fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
          ></path>
        </svg>
      </span>
      {{ isLoading ? "Logging in..." : "Login" }}
    </button>
  </form>

  <div class="mt-4 text-center">
    <a routerLink="/test-register" class="text-primary hover:underline"
      >Don't have an account? Register here</a
    >
  </div>

  <div class="mt-6 p-4 bg-gray-50 rounded-md">
    <h3 class="font-medium mb-2">Debug Information:</h3>
    <pre class="text-xs overflow-auto max-h-40">
Form Status: {{ loginForm.status }}
Form Value: {{ loginForm.value | json }}</pre
    >
  </div>
</div>
